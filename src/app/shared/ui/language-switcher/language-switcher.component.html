<label class="language-switcher">
  <span class="language-switcher__icon" aria-hidden="true">🌐</span>
  <span class="language-switcher__label">{{ 'language.label' | transloco }}</span>
  <span class="language-switcher__control">
    <select
      class="language-switcher__select"
      [value]="language.activeLanguage()"
      (change)="setLanguage($event)"
    >
      @for (option of language.languages; track option.code) {
        <option [value]="option.code">{{ option.label }}</option>
      }
    </select>
    <span class="language-switcher__chevron" aria-hidden="true"></span>
  </span>
</label>
