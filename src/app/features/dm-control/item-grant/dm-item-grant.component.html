<details class="dm-section dm-section--inventory" open>
  <summary class="dm-section__title">🎒 {{ 'itemGrant.title' | transloco }}</summary>
  <div class="dm-inventory-form">
    <div class="field-row">
      <div class="field">
        <label class="field__label" for="dm-item-player">{{ 'common.player' | transloco }}</label>
        <select
          id="dm-item-player"
          class="field__input"
          [value]="selectedPlayerId() || ''"
          (change)="onPlayerChange($event)"
        >
          <option value="" disabled>{{ 'common.selectPlayer' | transloco }}</option>
          @for (player of players() | keyvalue; track player.value.id) {
            <option [value]="player.value.id">{{ player.value.name }}</option>
          }
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="dm-item-name">{{ 'common.item' | transloco }}</label>
        <input
          id="dm-item-name"
          class="field__input"
          type="text"
          [placeholder]="'itemGrant.namePlaceholder' | transloco"
          [value]="itemName()"
          (input)="setText(itemName, $event)"
        />
      </div>
      <div class="field">
        <label class="field__label" for="dm-item-description">{{ 'common.description' | transloco }}</label>
        <input
          id="dm-item-description"
          class="field__input"
          type="text"
          [placeholder]="'itemGrant.descriptionPlaceholder' | transloco"
          [value]="description()"
          (input)="setText(description, $event)"
        />
      </div>
      <div class="field field--wide">
        <label class="field__label" for="dm-item-rarity">{{ 'common.rarity' | transloco }}</label>
        <select id="dm-item-rarity" class="field__input" [value]="rarity()" (change)="onRarityChange($event)">
          <option value="common">{{ 'item.rarity.common' | transloco }}</option>
          <option value="uncommon">{{ 'item.rarity.uncommon' | transloco }}</option>
          <option value="rare">{{ 'item.rarity.rare' | transloco }}</option>
          <option value="epic">{{ 'item.rarity.epic' | transloco }}</option>
          <option value="legendary">{{ 'item.rarity.legendary' | transloco }}</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="dm-item-quantity">{{ 'common.quantity' | transloco }}</label>
        <input
          id="dm-item-quantity"
          class="field__input"
          type="number"
          min="1"
          [value]="quantity()"
          (input)="onQuantityInput($event)"
        />
      </div>
    </div>
    <button
      class="dm-btn"
      [disabled]="!selectedPlayerId() || !itemName().trim() || quantity() < 1 || saving()"
      (click)="giveItem()"
    >{{ (saving() ? 'common.giving' : 'itemGrant.submit') | transloco }}</button>
  </div>
</details>
