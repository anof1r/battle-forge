<section class="dm-section dm-section--history">
  <h3 class="dm-section__title">📜 {{ 'battleHistory.title' | transloco: { count: history().length } }}</h3>
  <div class="dm-history">
    @for (entry of history().slice().reverse(); track entry.id) {
      <div class="dm-history__entry">
        <span>{{ entry.description }}</span>
        <time>{{ entry.timestamp | date: 'HH:mm:ss' }}</time>
      </div>
    } @empty {
      <p class="empty-hint">{{ 'battleHistory.empty' | transloco }}</p>
    }
  </div>
</section>
