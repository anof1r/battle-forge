name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase Emulator
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Create CI environments
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const fakeFirebase = {
            apiKey: 'demo-api-key',
            authDomain: 'demo-battle-forge.firebaseapp.com',
            databaseURL: 'https://demo-battle-forge-default-rtdb.firebaseio.com',
            projectId: 'demo-battle-forge',
            storageBucket: 'demo-battle-forge.appspot.com',
            messagingSenderId: '000000000000',
            appId: 'demo-app-id',
          };
          const secretFirebase = {
            apiKey: process.env.FIREBASE_API_KEY,
            authDomain: process.env.FIREBASE_AUTH_DOMAIN,
            databaseURL: process.env.FIREBASE_DATABASE_URL,
            projectId: process.env.FIREBASE_PROJECT_ID,
            storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
            messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
            appId: process.env.FIREBASE_APP_ID,
          };

          if (process.env.GITHUB_EVENT_NAME === 'push') {
            const missing = Object.entries(secretFirebase)
              .filter(([, value]) => !value)
              .map(([name]) => name);
            if (missing.length > 0) {
              throw new Error(`Missing Firebase secrets: ${missing.join(', ')}`);
            }
          }

          const serialize = (production, firebase) =>
            `export const environment = ${JSON.stringify({ production, firebase }, null, 2)};\n`;

          fs.mkdirSync('src/environments', { recursive: true });
          fs.writeFileSync('src/environments/environment.ts', serialize(false, fakeFirebase));
          fs.writeFileSync(
            'src/environments/environment.prod.ts',
            serialize(true, process.env.GITHUB_EVENT_NAME === 'push' ? secretFirebase : fakeFirebase),
          );
          NODE

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Run Firebase Emulator integration tests
        run: npm run test:firebase

      - name: Build Angular app
        run: npm run build:prod

      - name: Create 404.html for routing
        run: cp ./dist/battle-forge/browser/index.html ./dist/battle-forge/browser/404.html

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/battle-forge/browser

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
