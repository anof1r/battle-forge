name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create fake environment.ts for tests
        run: |
          mkdir -p src/environments
          echo "export const environment = { production: false, firebase: { apiKey: 'fake', authDomain: 'fake.firebaseapp.com', databaseURL: 'https://fake.firebaseio.com', projectId: 'fake', storageBucket: 'fake.appspot.com', messagingSenderId: 'fake', appId: 'fake' } };" > src/environments/environment.ts

      - name: Run tests (Vitest)
        run: npm run test:ci

      - name: Create production environment.ts from secrets
        run: |
          echo "export const environment = {" > src/environments/environment.prod.ts
          echo "  production: true," >> src/environments/environment.prod.ts
          echo "  firebase: {" >> src/environments/environment.prod.ts
          echo "    apiKey: '${{ secrets.FIREBASE_API_KEY }}'," >> src/environments/environment.prod.ts
          echo "    authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}'," >> src/environments/environment.prod.ts
          echo "    databaseURL: '${{ secrets.FIREBASE_DATABASE_URL }}'," >> src/environments/environment.prod.ts
          echo "    projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'," >> src/environments/environment.prod.ts
          echo "    storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}'," >> src/environments/environment.prod.ts
          echo "    messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}'," >> src/environments/environment.prod.ts
          echo "    appId: '${{ secrets.FIREBASE_APP_ID }}'" >> src/environments/environment.prod.ts
          echo "  }" >> src/environments/environment.prod.ts
          echo "};" >> src/environments/environment.prod.ts

      - name: Replace environment.ts with production version
        run: cp src/environments/environment.prod.ts src/environments/environment.ts

      - name: Build Angular app
        run: npm run build -- --configuration production --base-href "/battle-forge/"

      - name: Create 404.html for routing
        run: cp ./dist/battle-forge/browser/index.html ./dist/battle-forge/browser/404.html

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/battle-forge/browser

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
